<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quest Begins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <h1>Pack Your Bag</h1>

        <form action="page4.html" method="GET">

            <label>
                <input type="checkbox" name="provisions" value="food">
                Food
            </label>

            <label>
                <input type="checkbox" name="provisions" value="water">
                Water
            </label>

            <label>
                <input type="checkbox" name="provisions" value="magic_potions">
                Magic Potions
            </label>

            <label>
                <input type="checkbox" name="provisions" value="maps">
                Maps
            </label>

            <label>
                <input type="checkbox" name="provisions" value="sword">
                Sword
            </label>
            <br>
            <button type="submit">Continue</button>

        </form>
    </section>
    Checkboxes allow multiple things to be selected at once instead of a dropdown where only one option can be chosen.
</html>
