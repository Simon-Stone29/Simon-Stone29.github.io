<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Stone's Website</title>
   

    <style>
        /* The animation code */


        @keyframes color {
            0% {
                color: blue;
            }

            25%{
                color: green;
            }
            50%{
                color: red;      
            }
            75%{
                color: yellow;
            }
            100% {
            color: blue;
            }
        }

       @keyframes slide {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(0);
            }
        }



        /* The element to apply the animation to */
        h1 {
        width: 20%;
        animation: color 2s linear infinite; 
        }
       /*  h1:hover {
        width: 20%;
        height: 20%;
        position: 50px,50px;
        animation: color 2s linear infinite; 
        } */
    </style>
</head>
<body>
    <h1>
        Simon Stone's Website
    </h1>
<video
  autoplay
  muted
  loop
  playsinline
  style="
    width: 50%;
    position: fixed;
    right: -10%;
    top: 0;
    pointer-events: none;
    animation: slide 4s ease-in-out infinite;
    animation-delay: 2s;
  "
>
  <source src="iphoneloop.mp4" type="video/mp4">
</video>


        
</body>
</html>
