<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <style>
        main{
            margin-left: 10%;
        }
        .submit-bar{
            display: flex;
        }
        .guessing-game{
         
         
            justify-content: center;
            width: 30%;
            flex-wrap: wrap;
        }
    </style>
  </head>
  <body>
    <main>
        <button id="button_A"> Press Me </button>
      <h3 id="heading_A">Name</h3>

      <input id="textBox" type="text"/>
      <div id=output></div>

      <button> Press Me </button>
      <div id="greeting"></div>

      <br>
       <br>
    
    <div class="guessing-game">
        <h1> Number Guessing Game</h1>
    We have selected a random number between 1 and 100. See if you can guess it in 10 turns or fewer. We'll tell you if your guess was too high or too low.
    <br>

    <div class="submit-bar">
     Enter a guess:  
      <input id="guess" type="text">
      
      <button id="guessButton">Submit Guess</button>
      </div>
      <div class = "submit-bar">
      Previous guesses:
      <div class="prev-guesses"> </div>
      </div>
      <div id="highLow"></div>
      
    </div>
    </main>
    
    


  <script>

    // Name input
    const buttonA = document.querySelector("#button_A")
    const headingA = document.querySelector("#heading_A");
 

    buttonA.addEventListener("click", function() {
      const name = prompt("what is your name");
      alert(`helo ${name}, nice to see you!`);
      headingA.textContent=name;           
});

// Show input as types
      const output = document.querySelector("#output");
      const textBox = document.querySelector("#textBox")
      textBox.addEventListener("input", function(){
        output.textContent = textBox.value;
      });

  // Greeting button
    const buttonB = document.querySelector("button")
 
    buttonB.addEventListener("click", function() {
      const name = prompt("what is your name");
      const greeting = document.querySelector("#greeting")
      greeting.textContent = `helo ${name}, nice to see you!`;
});


  // Guessing game
      const num = Math.floor(Math.random() * 100) + 1;
      const highLow = document.querySelector("#highLow");
      const guess = document.querySelector("#guess")
      const guessButton = document.querySelector("#guessButton")
      const previousGuesses = document.querySelector(".prev-guesses")
      let numGuesses = 0;
      guessButton.addEventListener("click", function(){
        previousGuesses.textContent += guess.value + " ";
        numGuesses++;
        if(guess.value < num){
        highLow.textContent = guess.value + " is too low, guess again!";}
        else if(guess.value > num){
        highLow.textContent = guess.value + " is too high, guess again!";
        }
        else{
          highLow.textContent = "You guessed it! the number was " + num;
        }
        if(numGuesses >= 10){
            guessButton.disabled = true;
        }
      });


  </script>
  
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
